# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Publishes the particularity trainer as the site index, with the map beside it:
#   https://hyperpolymath.github.io/trope-particularity-workbench/

name: GitHub Pages (trainer)
on:
  push:
    branches: [main]
    paths: ['assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Assemble site
        run: |
          mkdir -p _site
          cp assets/particularity-trainer.html _site/index.html
          cp assets/trope-particularity-map.svg _site/trope-particularity-map.svg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
