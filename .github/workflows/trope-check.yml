#
# Workbench: the nine effects must stay consistent across vocabulary, trainer, map, README.
name: trope-check

on:
  push:
    paths:
      - 'vocabulary/**'
      - 'assets/**'
      - 'README.adoc'
      - 'tests/**'
      - '.github/workflows/trope-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nine-effects-consistent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nine effects consistent (vocabulary / trainer / map / README)
        run: python3 tests/check-vocabulary.py
