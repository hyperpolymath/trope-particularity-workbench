#
# Workbench: the nine effects stay consistent across vocabulary, trainer, map, README (bash; no Python).
name: "🔴 Gate: Trope conformance"
on:
  push:
    paths: ['vocabulary/**', 'assets/**', 'README.adoc', 'tests/**', '.github/workflows/trope-check.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nine-effects-consistent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Nine effects consistent (vocabulary / trainer / map / README)
        run: bash tests/check-vocabulary.sh
