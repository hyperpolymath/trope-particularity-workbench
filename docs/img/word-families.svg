<svg width="100%" viewBox="0 0 680 596" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Where each p-word fits: the trope-particularity workbench</title>
<desc>A top-to-bottom pipeline. A property-instance enters; one of seven effects acts on it; a residue (p-residual) is what survives; the residue is held against a declared use-model to produce a verdict, p-sufficient or p-insufficient. Effects are purple, the residue teal, the verdicts coral, the inputs gray.</desc>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;}
.t{font-size:14px;font-weight:400;}
.ts{font-size:12px;font-weight:400;}
.th{font-size:14px;font-weight:500;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="596" rx="12" fill="#FFFFFF"/>

<rect x="210" y="44" width="260" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="340" y="68" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A property-instance</text>
<text class="ts" x="340" y="88" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">quality, bearer, context, record</text>

<line x1="340" y1="102" x2="340" y2="124" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="70" y="128" width="540" height="210" rx="12" fill="#F7F5F0" stroke="#C7C5BB" stroke-width="0.5"/>
<text class="th" x="90" y="150" fill="#2C2C2A" dominant-baseline="central">Effects &#183; what happens to it</text>
<text class="ts" x="90" y="190" fill="#5F5E5A" dominant-baseline="central">Kept whole &#8212; no loss:</text>
<rect x="250" y="174" width="170" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="335" y="190" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-preserving</text>
<line x1="90" y1="224" x2="590" y2="224" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="90" y="242" fill="#5F5E5A" dominant-baseline="central">Lost or changed:</text>
<rect x="90" y="252" width="158" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="169" y="268" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-collapsing</text>
<rect x="261" y="252" width="158" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="340" y="268" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-conflating</text>
<rect x="432" y="252" width="158" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="511" y="268" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-fusing</text>
<rect x="90" y="296" width="158" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="169" y="312" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-detaching</text>
<rect x="261" y="296" width="158" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="340" y="312" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-projecting</text>
<rect x="432" y="296" width="158" height="32" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="511" y="312" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-attenuating</text>

<line x1="340" y1="338" x2="340" y2="362" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="364" width="260" height="58" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="340" y="386" fill="#085041" text-anchor="middle" dominant-baseline="central">p-residual</text>
<text class="ts" x="340" y="406" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">what survived &#8212; inspect it</text>

<line x1="340" y1="422" x2="340" y2="446" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="462" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="130" y="486" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Use-model</text>
<text class="ts" x="130" y="506" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">declared: what it's for</text>
<line x1="220" y1="494" x2="268" y2="494" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="448" width="340" height="92" rx="12" fill="#F7F5F0" stroke="#C7C5BB" stroke-width="0.5"/>
<text class="th" x="290" y="470" fill="#2C2C2A" dominant-baseline="central">Verdict &#183; is the leftover enough?</text>
<rect x="290" y="486" width="140" height="42" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="th" x="360" y="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">p-sufficient</text>
<text class="ts" x="360" y="516" fill="#993C1D" text-anchor="middle" dominant-baseline="central">enough for the use</text>
<rect x="450" y="486" width="140" height="42" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="th" x="520" y="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">p-insufficient</text>
<text class="ts" x="520" y="516" fill="#993C1D" text-anchor="middle" dominant-baseline="central">not enough</text>

<rect x="40" y="560" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="ts" x="60" y="567" fill="#5F5E5A" dominant-baseline="central">Effects</text>
<rect x="200" y="560" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="ts" x="220" y="567" fill="#5F5E5A" dominant-baseline="central">Residue</text>
<rect x="360" y="560" width="14" height="14" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="380" y="567" fill="#5F5E5A" dominant-baseline="central">Verdicts</text>
<rect x="520" y="560" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="540" y="567" fill="#5F5E5A" dominant-baseline="central">Inputs</text>
</svg>
