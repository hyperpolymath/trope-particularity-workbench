<title>Where each p-word fits: the trope-particularity workbench (nine effects)</title>
<desc>A top-to-bottom pipeline. A property-instance enters; one of NINE effects acts on it; a residue (p-residual) is what survives; the residue is held against a declared use-model to produce a verdict, p-sufficient or p-insufficient. The effects box splits two independent ways: by loss amount (no-loss vs with-loss) and by veridicality (faithful vs the three deceptive duals). Effects are purple, the residue teal, the verdicts coral, the inputs gray.</desc>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;}
.t{font-size:14px;font-weight:400;}
.ts{font-size:12px;font-weight:400;}
.th{font-size:13px;font-weight:500;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="700" rx="12" fill="#FFFFFF"/>

<rect x="210" y="44" width="260" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="340" y="68" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A property-instance</text>
<text class="ts" x="340" y="88" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">quality, bearer, context, record</text>

<line x1="340" y1="102" x2="340" y2="124" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="128" width="600" height="300" rx="12" fill="#F7F5F0" stroke="#C7C5BB" stroke-width="0.5"/>
<text class="th" x="60" y="150" fill="#2C2C2A" dominant-baseline="central">Effects &#183; what happens to it</text>
<text class="ts" x="60" y="167" fill="#5F5E5A" dominant-baseline="central">two independent splits: loss amount (rows) &#183; veridicality (faithful vs deceptive)</text>

<text class="ts" x="60" y="196" fill="#5F5E5A" dominant-baseline="central">Kept whole &#8212; no loss:</text>
<rect x="250" y="182" width="170" height="30" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="th" x="335" y="197" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-preserving</text>

<line x1="60" y1="218" x2="620" y2="218" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="60" y="236" fill="#5F5E5A" dominant-baseline="central">With loss &#8212; faithful:</text>
<rect x="250" y="222" width="120" height="30" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="th" x="310" y="237" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-projecting</text>
<rect x="380" y="222" width="120" height="30" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="th" x="440" y="237" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-collapsing</text>
<rect x="510" y="222" width="120" height="30" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="th" x="570" y="237" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-detaching</text>
<rect x="250" y="260" width="120" height="30" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="th" x="310" y="275" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-attenuating</text>
<rect x="380" y="260" width="120" height="30" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="th" x="440" y="275" fill="#3C3489" text-anchor="middle" dominant-baseline="central">p-fusing</text>

<line x1="60" y1="300" x2="620" y2="300" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="60" y="320" fill="#993C1D" dominant-baseline="central">Deceptive &#8212; false (veridicality):</text>
<rect x="250" y="306" width="120" height="30" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="th" x="310" y="321" fill="#712B13" text-anchor="middle" dominant-baseline="central">p-falsifying</text>
<rect x="380" y="306" width="120" height="30" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="th" x="440" y="321" fill="#712B13" text-anchor="middle" dominant-baseline="central">p-misbinding</text>
<rect x="510" y="306" width="120" height="30" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="th" x="570" y="321" fill="#712B13" text-anchor="middle" dominant-baseline="central">p-conflating</text>
<text class="ts" x="60" y="356" fill="#5F5E5A" dominant-baseline="central">false value &#183; false bearer &#183; false singleness</text>
<text class="ts" x="60" y="392" fill="#5F5E5A" dominant-baseline="central">Arity: seven single-instance; two two-instance (p-conflating, p-fusing).</text>
<text class="ts" x="60" y="410" fill="#5F5E5A" dominant-baseline="central">Deceptive grades are not writable &#8212; caught at the checker's validation boundary.</text>

<line x1="340" y1="428" x2="340" y2="452" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="454" width="260" height="58" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="340" y="476" fill="#085041" text-anchor="middle" dominant-baseline="central">p-residual</text>
<text class="ts" x="340" y="496" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">what survived &#8212; inspect it</text>

<line x1="340" y1="512" x2="340" y2="536" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="552" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="130" y="576" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Use-model</text>
<text class="ts" x="130" y="596" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">declared: what it's for</text>
<line x1="220" y1="584" x2="268" y2="584" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="538" width="370" height="92" rx="12" fill="#F7F5F0" stroke="#C7C5BB" stroke-width="0.5"/>
<text class="th" x="290" y="560" fill="#2C2C2A" dominant-baseline="central">Verdict &#183; is the leftover enough?</text>
<rect x="290" y="576" width="150" height="42" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="365" y="590" fill="#27500A" text-anchor="middle" dominant-baseline="central">p-sufficient</text>
<text class="ts" x="365" y="606" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">enough for the use</text>
<rect x="470" y="576" width="150" height="42" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="th" x="545" y="590" fill="#712B13" text-anchor="middle" dominant-baseline="central">p-insufficient</text>
<text class="ts" x="545" y="606" fill="#993C1D" text-anchor="middle" dominant-baseline="central">not enough</text>

<rect x="40" y="652" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/><text class="ts" x="60" y="659" fill="#5F5E5A" dominant-baseline="central">Effects</text>
<rect x="170" y="652" width="14" height="14" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="190" y="659" fill="#5F5E5A" dominant-baseline="central">Deceptive / verdict</text>
<rect x="330" y="652" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/><text class="ts" x="350" y="659" fill="#5F5E5A" dominant-baseline="central">Residue</text>
<rect x="460" y="652" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text class="ts" x="480" y="659" fill="#5F5E5A" dominant-baseline="central">Inputs</text>
</svg>
